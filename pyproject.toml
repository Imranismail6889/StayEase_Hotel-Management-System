[project]
name = "stayease"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.1",
    "Flask-Cors==6.0.1",
    "Flask-JWT-Extended==4.7.1",
    "Flask-Limiter==3.12",
    "Flask-Migrate==4.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "PyMySQL==1.2.3",
    "SQLAlchemy==2.0.41",
    "marshmallow==4.0.0",
    "psycopg[binary]==3.3.8",
    "python-dotenv==1.1.1",
]

[tool.vercel.scripts]
build = "python scripts/sync_vercel_static.py"
